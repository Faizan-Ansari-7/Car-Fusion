<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fusion Lab Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container py-5">
        <h1 class="mb-4">🧪 Fusion Lab Test Suite</h1>
        
        <div class="card bg-secondary mb-4">
            <div class="card-body">
                <h5 class="card-title">Test 1: Login Status</h5>
                <div id="loginStatus" class="alert">Checking...</div>
                <button class="btn btn-warning btn-sm" onclick="testLogin()">Re-test</button>
            </div>
        </div>

        <div class="card bg-secondary mb-4">
            <div class="card-body">
                <h5 class="card-title">Test 2: Cars Array</h5>
                <div id="carsStatus" class="alert">Checking...</div>
                <button class="btn btn-warning btn-sm" onclick="testCars()">Re-test</button>
            </div>
        </div>

        <div class="card bg-secondary mb-4">
            <div class="card-body">
                <h5 class="card-title">Test 3: Expected Behavior</h5>
                <div class="alert alert-info">
                    <strong>Without Login:</strong> Should show lock screen<br>
                    <strong>With Login:</strong> Should show car selector with cars
                </div>
            </div>
        </div>

        <div class="d-flex gap-3 mb-4">
            <button class="btn btn-success" onclick="createTestUser()">Create Test User</button>
            <button class="btn btn-danger" onclick="clearTestUser()">Clear Test User</button>
            <a href="modify.html" class="btn btn-primary">Open Fusion Lab</a>
            <a href="login.html" class="btn btn-info">Go to Login</a>
        </div>

        <div class="card bg-secondary">
            <div class="card-body">
                <h5 class="card-title">Debug Info</h5>
                <pre id="debugInfo" class="bg-dark p-3 rounded" style="max-height: 300px; overflow-y: auto;">Loading...</pre>
            </div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        function testLogin() {
            const statusEl = document.getElementById('loginStatus');
            const user = localStorage.getItem('currentUser');
            
            if (!user) {
                statusEl.className = 'alert alert-danger';
                statusEl.innerHTML = '❌ <strong>FAIL:</strong> No user logged in';
            } else {
                try {
                    const userData = JSON.parse(user);
                    if (userData && userData.name) {
                        statusEl.className = 'alert alert-success';
                        statusEl.innerHTML = `✅ <strong>PASS:</strong> User logged in as "${userData.name}"`;
                    } else {
                        statusEl.className = 'alert alert-warning';
                        statusEl.innerHTML = '⚠️ <strong>WARNING:</strong> User exists but missing name field';
                    }
                } catch (e) {
                    statusEl.className = 'alert alert-danger';
                    statusEl.innerHTML = '❌ <strong>FAIL:</strong> User data corrupted';
                }
            }
            updateDebugInfo();
        }

        function testCars() {
            const statusEl = document.getElementById('carsStatus');
            
            if (typeof cars === 'undefined') {
                statusEl.className = 'alert alert-danger';
                statusEl.innerHTML = '❌ <strong>FAIL:</strong> Cars array not loaded (main.js not loaded?)';
            } else if (!cars || cars.length === 0) {
                statusEl.className = 'alert alert-danger';
                statusEl.innerHTML = '❌ <strong>FAIL:</strong> Cars array is empty';
            } else {
                statusEl.className = 'alert alert-success';
                statusEl.innerHTML = `✅ <strong>PASS:</strong> ${cars.length} cars loaded`;
            }
            updateDebugInfo();
        }

        function createTestUser() {
            const testUser = {
                name: "Test User",
                email: "test@carfusion.com",
                mobile: "9999999999",
                joined: new Date().toLocaleDateString(),
                favorites: [],
                bookings: []
            };
            
            localStorage.setItem('currentUser', JSON.stringify(testUser));
            alert('✅ Test user created! Now try opening Fusion Lab.');
            testLogin();
        }

        function clearTestUser() {
            localStorage.removeItem('currentUser');
            alert('🗑️ Test user cleared! Fusion Lab should now show lock screen.');
            testLogin();
        }

        function updateDebugInfo() {
            const debugEl = document.getElementById('debugInfo');
            const info = {
                currentUser: localStorage.getItem('currentUser'),
                carsLoaded: typeof cars !== 'undefined',
                carsCount: typeof cars !== 'undefined' ? cars.length : 0,
                timestamp: new Date().toLocaleString()
            };
            
            debugEl.textContent = JSON.stringify(info, null, 2);
        }

        // Run tests on load
        window.addEventListener('load', () => {
            testLogin();
            testCars();
        });
    </script>
</body>
</html>
