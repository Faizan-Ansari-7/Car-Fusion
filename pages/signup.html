<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Club | Car Fusion</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/main_interface.css">
    <link rel="icon" href="../assets/icons/car_fusion_favicon.ico">

    <style>
        .signup-section {
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
                url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070');
            background-size: cover;
            background-position: center;
            min-height: 90vh;
            display: flex;
            align-items: center;
        }
    </style>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () {
            emailjs.init("uWcrGjqNF8rUW3GC1");
        })();
    </script>
</head>

<body class="euro-body">

    <header class="euro-header fixed-top">
        <div class="top-bar">
            <div class="container d-flex align-items-center justify-content-between">
                <a class="navbar-brand me-4" href="../index.html">
                    <img src="../assets/images/car_fusion_logo.png" alt="Car Fusion" class="logo-size">
                </a>
                <a href="login.html" class="text-white text-decoration-none small fw-bold hover-gold">
                    <i class="bi bi-arrow-left me-2"></i> Back to Login
                </a>
            </div>
        </div>
    </header>

    <div class="header-spacer"></div>

    <section class="signup-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5">

                    <div class="euro-card border-0 shadow-lg" style="border-top: 4px solid #D4AF37 !important;">
                        <div class="p-5">
                            <div class="text-center mb-4">
                                <h4 class="fw-bold text-uppercase ls-2">Create Account</h4>
                                <p class="text-secondary small">Join the elite circle</p>
                                <div class="divider-gold"></div>
                            </div>

                            <div id="signupAlert" class="alert alert-danger rounded-0 d-none small" role="alert"></div>

                            <form id="signupForm" novalidate>
                                <div id="signupStep1">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control rounded-0" id="nameInput"
                                            placeholder="Name" required>
                                        <label>Full Name</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="email" class="form-control rounded-0" id="signupEmail"
                                            placeholder="Email" required>
                                        <label>Email Address</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="password" class="form-control rounded-0" id="signupPass"
                                            placeholder="Password" required minlength="6">
                                        <label>Password</label>
                                    </div>
                                    <div class="form-floating mb-4">
                                        <input type="password" class="form-control rounded-0" id="confirmPass"
                                            placeholder="Confirm" required>
                                        <label>Confirm Password</label>
                                    </div>

                                    <button type="button"
                                        class="btn btn-gold w-100 py-3 rounded-0 mb-4 shadow-sm fw-bold"
                                        onclick="sendSignupOTP()">
                                        SEND OTP
                                    </button>
                                </div>

                                <div id="signupStep2" class="d-none">
                                    <p class="text-white text-center mb-3">An OTP has been sent to your email.</p>
                                    <div class="form-floating mb-4">
                                        <input type="text" class="form-control rounded-0 text-center fw-bold fs-4"
                                            id="signupOtpInput" placeholder="Enter 4-Digit OTP" maxlength="4">
                                        <label>Enter OTP</label>
                                    </div>
                                    <button type="submit"
                                        class="btn btn-gold w-100 py-3 rounded-0 mb-4 shadow-sm fw-bold">
                                        VERIFY & REGISTER
                                    </button>
                                    <div class="d-flex justify-content-between mt-3">
                                        <button type="button" id="signupResendBtn"
                                            class="btn btn-link text-white small p-0 text-decoration-none"
                                            onclick="resendSignupOTP()">
                                            Resend OTP <span id="signupTimerText"></span>
                                        </button>
                                        <button type="button"
                                            class="btn btn-link text-white small p-0 text-decoration-none"
                                            onclick="location.reload()">
                                            Change Email
                                        </button>
                                    </div>
                                </div>

                                <div class="text-center">
                                    <a href="login.html"
                                        class="text-white fw-bold small text-decoration-none border-bottom border-light">Already
                                        have an account?</a>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>

    <footer class="pt-4 pb-3 mt-5" style="background: #000;">
        <div class="container text-center">
            <p class="text-secondary small mb-0">&copy; 2026 Car Fusion. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        let signupTimerInterval;

        function startSignupTimer() {
            let timeLeft = 60;
            const resendBtn = document.getElementById("signupResendBtn");
            const timerText = document.getElementById("signupTimerText");

            resendBtn.disabled = true;
            resendBtn.style.pointerEvents = "none";
            timerText.innerText = `(${timeLeft}s)`;

            clearInterval(signupTimerInterval);
            signupTimerInterval = setInterval(() => {
                timeLeft--;
                timerText.innerText = `(${timeLeft}s)`;

                if (timeLeft <= 0) {
                    clearInterval(signupTimerInterval);
                    resendBtn.disabled = false;
                    resendBtn.style.pointerEvents = "auto";
                    timerText.innerText = "";
                }
            }, 1000);
        }

        function sendSignupOTP() {
            const name = document.getElementById("nameInput").value;
            const email = document.getElementById("signupEmail").value;
            const pass = document.getElementById("signupPass").value;
            const confirmPass = document.getElementById("confirmPass").value;
            const alertBox = document.getElementById("signupAlert");

            if (!name || !email || !pass) {
                alertBox.innerText = "Please fill all fields.";
                alertBox.classList.remove("d-none");
                return;
            }
            if (pass !== confirmPass) {
                alertBox.innerText = "Passwords do not match!";
                alertBox.classList.remove("d-none");
                return;
            }

            const otp = Math.floor(1000 + Math.random() * 9000);
            sessionStorage.setItem("carFusionSignupOTP", otp);

            const templateParams = {
                otp: otp,
                to_email: email,
                name: "Car Fusion"
            };

            emailjs.send('service_z197g0f', 'template_45dg0lh', templateParams)
                .then(function (response) {
                    alertBox.classList.add("d-none");
                    document.getElementById("signupStep1").classList.add("d-none");
                    document.getElementById("signupStep2").classList.remove("d-none");
                    startSignupTimer();
                }, function (error) {
                    alertBox.innerText = "Failed to send OTP. Please try again.";
                    alertBox.classList.remove("d-none");
                });
        }

        function resendSignupOTP() {
            document.getElementById("signupOtpInput").value = "";
            sendSignupOTP();
        }

        document.getElementById("signupForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const enteredOtp = document.getElementById("signupOtpInput").value;
            const savedOtp = sessionStorage.getItem("carFusionSignupOTP");
            const alertBox = document.getElementById("signupAlert");

            if (enteredOtp === savedOtp) {
                alert("Account Created Successfully! Welcome to the Club.");
                sessionStorage.removeItem("carFusionSignupOTP");
                window.location.href = "login.html";
            } else {
                alertBox.innerText = "Invalid OTP. Please try again.";
                alertBox.classList.remove("d-none");
            }
        });
    </script>
</body>

</html>
